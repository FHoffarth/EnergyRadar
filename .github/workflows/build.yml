name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  WINDOWS_PYTHON_VERSION: "3.14"
  MACOS_PYTHON_VERSION: "3.12"
  # Pull requests normally expose an ephemeral merge SHA. Artifacts must use
  # and build the immutable pull-request head itself.
  ENERGYRADAR_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ENERGYRADAR_SOURCE_COMMIT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/react-ui/package-lock.json

      - name: Build React UI
        working-directory: frontend/react-ui
        shell: pwsh
        run: |
          npm.cmd ci
          npm.cmd run lint
          npm.cmd run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.WINDOWS_PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            energyradar/requirements.txt
            requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r energyradar/requirements.txt -r requirements-build.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v

      - name: Build canonical desktop bundle
        run: python tools/build.py

      - name: Validate bundle contract
        shell: pwsh
        run: |
          $requiredFiles = @(
            "dist/EnergyRadar/EnergyRadar.exe",
            "dist/EnergyRadar/_internal/react-ui/dist/index.html",
            "dist/EnergyRadar/_internal/PySide6/Qt6WebEngineCore.dll",
            "dist/EnergyRadar/_internal/PySide6/QtWebEngineProcess.exe",
            "dist/EnergyRadar/_internal/PySide6/plugins/platforms/qwindows.dll"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Incomplete Windows bundle: $file is missing."
            }
          }

      - name: Packaged startup smoke
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowAudit {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr hWnd);
              [DllImport("user32.dll")]
              public static extern bool IsIconic(IntPtr hWnd);
          }
          '@

          $smokeProfile = Join-Path $env:RUNNER_TEMP "energyradar-window-smoke"
          $smokeData = Join-Path $smokeProfile "EnergyRadar"
          New-Item -ItemType Directory -Path $smokeData -Force | Out-Null
          '{"width":980,"height":900,"x":-32000,"y":-32000}' |
            Set-Content -LiteralPath (Join-Path $smokeData "window.json") -Encoding utf8
          $env:LOCALAPPDATA = $smokeProfile
          Remove-Item Env:FRONIUS_URL -ErrorAction SilentlyContinue
          Remove-Item Env:ENERGYRADAR_DEMO -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath "dist/EnergyRadar/EnergyRadar.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $stableAfter = (Get-Date).AddSeconds(10)
          $started = $false

          try {
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "EnergyRadar exited during startup with code $($process.ExitCode)."
              }
              if ((Get-Date) -ge $stableAfter -and $process.MainWindowTitle -eq "EnergyRadar") {
                $handle = [IntPtr]$process.MainWindowHandle
                if ($handle -eq [IntPtr]::Zero -or -not [WindowAudit]::IsWindowVisible($handle)) {
                  throw "EnergyRadar did not create a visible top-level window."
                }
                if ([WindowAudit]::IsIconic($handle)) {
                  throw "EnergyRadar restored in a minimized state."
                }

                $rect = New-Object WindowAudit+RECT
                if (-not [WindowAudit]::GetWindowRect($handle, [ref]$rect)) {
                  throw "Could not read the EnergyRadar window geometry."
                }
                $onScreen = [System.Windows.Forms.Screen]::AllScreens | Where-Object {
                  $bounds = $_.Bounds
                  $rect.Right -gt $bounds.Left -and
                  $rect.Left -lt $bounds.Right -and
                  $rect.Bottom -gt $bounds.Top -and
                  $rect.Top -lt $bounds.Bottom
                }
                if (-not $onScreen) {
                  throw "EnergyRadar window is outside every monitor."
                }
                Write-Host "Visible on-screen EnergyRadar window verified."
                $started = $true
                break
              }
            }
            if (-not $started) {
              throw "No EnergyRadar window appeared within 30 seconds."
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

          $diagnosticLog = Join-Path $smokeData "energyradar.log"
          if (-not (Test-Path -LiteralPath $diagnosticLog)) {
            throw "Packaged startup diagnostic log is missing."
          }
          if (Select-String -LiteralPath $diagnosticLog -SimpleMatch "[ERROR]" -Quiet) {
            Get-Content -LiteralPath $diagnosticLog
            throw "Packaged startup diagnostics contain an error."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnergyRadar-windows
          path: dist/EnergyRadar
          if-no-files-found: error
          retention-days: 30

      # The Windows runner image ships Inno Setup (windows-latest -> Windows
      # Server 2025, "InnoSetup 6.7.1"), so no download or third-party action is
      # needed. The image does not document the ISCC.exe path, so locate it
      # instead of hardcoding, and fail loudly if the image ever drops it.
      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) not found on this runner image."
          }
          "  ISCC: $iscc"
          # Inno Setup ships no VERSIONINFO on ISCC.exe (FileVersion reads
          # 0.0.0.0), so take the version from the compiler's own banner.
          # Running it without arguments prints usage and exits non-zero.
          $banner = (& $iscc 2>&1 | Select-Object -First 1)
          $global:LASTEXITCODE = 0
          "  compiler: $banner"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile Windows installer
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Package exactly the bundle this job just built and smoke-tested.
          $payloadExe = "dist/EnergyRadar/EnergyRadar.exe"
          if (-not (Test-Path -LiteralPath $payloadExe)) {
            throw "Application payload is missing: $payloadExe"
          }
          $payloadCount = (Get-ChildItem dist/EnergyRadar -Recurse -File).Count
          $payloadHash = (Get-FileHash -LiteralPath $payloadExe -Algorithm SHA256).Hash
          "  payload files      : $payloadCount"
          "  payload exe SHA256 : $payloadHash"

          # Derive the version from the installer script so CI cannot drift
          # from installer/EnergyRadar.iss when the version is bumped.
          $iss = Get-Content installer/EnergyRadar.iss -Raw
          if ($iss -notmatch '#define\s+MyAppVersion\s+"([^"]+)"') {
            throw "Could not read MyAppVersion from installer/EnergyRadar.iss"
          }
          $version = $Matches[1]
          $setupName = "EnergyRadar-$version-Setup.exe"
          "  version            : $version"
          "  expected installer : $setupName"

          & "${{ steps.inno.outputs.iscc }}" /Q installer\EnergyRadar.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

          "version=$version"            >> $env:GITHUB_OUTPUT
          "setup_name=$setupName"       >> $env:GITHUB_OUTPUT
          "payload_count=$payloadCount" >> $env:GITHUB_OUTPUT

      - name: Verify installer and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "${{ steps.installer.outputs.setup_name }}"
          $setup = Join-Path "release" $name

          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            Get-ChildItem release -ErrorAction SilentlyContinue
            throw "Installer not found at expected path: $setup"
          }
          $item = Get-Item -LiteralPath $setup
          if ($item.Length -eq 0) {
            throw "Installer is zero bytes: $setup"
          }

          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -LiteralPath "$setup.sha256" -Encoding ascii -NoNewline

          if (-not (Test-Path -LiteralPath "$setup.sha256" -PathType Leaf)) {
            throw "Checksum file was not created."
          }

          # Verify the recorded checksum against a fresh read of the file.
          $recorded = ((Get-Content -LiteralPath "$setup.sha256" -Raw) -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLower()
          if ($recorded -ne $actual) {
            throw "Checksum verification failed: recorded $recorded, actual $actual."
          }

          "  installer      : $name"
          "  size           : $($item.Length) bytes"
          "  SHA256         : $actual"
          "  checksum file  : $name.sha256 (verified)"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnergyRadar-Windows-Installer-${{ steps.installer.outputs.version }}
          path: |
            release/${{ steps.installer.outputs.setup_name }}
            release/${{ steps.installer.outputs.setup_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Build macOS (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            label: Apple Silicon arm64
          - architecture: x86_64
            runner: macos-15-intel
            label: Intel x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ENERGYRADAR_SOURCE_COMMIT }}

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.architecture }}"
          echo "Native runner architecture: $(uname -m)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/react-ui/package-lock.json

      - name: Build React UI
        working-directory: frontend/react-ui
        run: |
          set -euo pipefail
          node_arch="$(node -p 'process.arch')"
          if [[ "${{ matrix.architecture }}" == "x86_64" ]]; then
            expected_node_arch="x64"
          else
            expected_node_arch="${{ matrix.architecture }}"
          fi
          test "$node_arch" = "$expected_node_arch"
          npm ci
          npm run lint
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.MACOS_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            energyradar/requirements.txt
            requirements-build.txt

      - name: Install architecture-native Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r energyradar/requirements.txt -r requirements-build.txt
          python3 - <<'PY'
          import platform
          import struct

          architecture = platform.machine()
          expected = "${{ matrix.architecture }}"
          if architecture != expected:
              raise SystemExit(f"Python architecture {architecture} does not match {expected}.")
          if struct.calcsize("P") != 8:
              raise SystemExit("Python is not a 64-bit runtime.")
          print(f"Native Python runtime verified: {architecture}")
          PY

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -m pytest tests/ -v

      - name: Build canonical desktop bundle
        run: python3 tools/build.py

      - name: Validate native bundle contract and write architecture audit
        run: |
          set -euo pipefail
          python3 tools/validate_macos_bundle.py \
            "dist/EnergyRadar.app" \
            --arch "${{ matrix.architecture }}" \
            --expected-source-commit "$ENERGYRADAR_SOURCE_COMMIT" \
            --report "dist/ARCHITECTURE-AUDIT.txt"
          plutil -lint "dist/EnergyRadar.app/Contents/Info.plist"

      - name: Packaged startup smoke
        shell: bash
        run: |
          set -euo pipefail
          app_bin="dist/EnergyRadar.app/Contents/MacOS/EnergyRadar"
          smoke_home="$RUNNER_TEMP/energyradar-${{ matrix.architecture }}-smoke"
          stdout_log="$RUNNER_TEMP/energyradar-${{ matrix.architecture }}-stdout.log"
          stderr_log="$RUNNER_TEMP/energyradar-${{ matrix.architecture }}-stderr.log"
          bundle_write_marker="$RUNNER_TEMP/energyradar-bundle-write-marker"
          mkdir -p "$smoke_home"
          touch "$bundle_write_marker"
          export HOME="$smoke_home"
          unset FRONIUS_URL ENERGYRADAR_DEMO

          "$app_bin" >"$stdout_log" 2>"$stderr_log" &
          app_pid=$!
          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill -TERM "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for second in $(seq 1 15); do
            sleep 1
            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid" || exit_code=$?
              cat "$stdout_log" || true
              cat "$stderr_log" >&2 || true
              echo "EnergyRadar exited during packaged startup smoke after ${second}s (exit ${exit_code:-0})." >&2
              exit 1
            fi
          done

          diagnostic_log="$HOME/Library/Application Support/EnergyRadar/energyradar.log"
          test -f "$diagnostic_log"
          test -f "$HOME/Library/Application Support/EnergyRadar/database/energy.db"
          if find "dist/EnergyRadar.app" -newer "$bundle_write_marker" -print -quit | grep -q .; then
            echo "Packaged startup wrote inside EnergyRadar.app." >&2
            find "dist/EnergyRadar.app" -newer "$bundle_write_marker" -print >&2
            exit 1
          fi
          if grep -Eiq \
            'Traceback|ImportError|ModuleNotFoundError|Library not loaded|wrong architecture|mach-o.*incompatible|\[ERROR\]' \
            "$stdout_log" "$stderr_log" "$diagnostic_log"; then
            cat "$stdout_log" || true
            cat "$stderr_log" >&2 || true
            cat "$diagnostic_log" >&2 || true
            echo "Packaged startup diagnostics contain a fatal error." >&2
            exit 1
          fi
          echo "Packaged ${{ matrix.architecture }} process remained healthy for 15 seconds."

      - name: Package commit-specific app, reports, and checksum
        id: artifact
        run: |
          set -euo pipefail
          short_sha="${ENERGYRADAR_SOURCE_COMMIT:0:7}"
          architecture="${{ matrix.architecture }}"
          filename="EnergyRadar-macOS-${{ matrix.architecture }}-${short_sha}.zip"
          staging="$RUNNER_TEMP/energyradar-${architecture}-artifact"
          mkdir -p "$staging"
          ditto "dist/EnergyRadar.app" "$staging/EnergyRadar.app"
          cp "dist/ARCHITECTURE-AUDIT.txt" "$staging/ARCHITECTURE-AUDIT.txt"
          cp "packaging/macos/MACOS-SMOKE-CHECKLIST.txt" "$staging/MACOS-SMOKE-CHECKLIST.txt"
          cp "packaging/macos/KNOWN-LIMITATIONS.txt" "$staging/KNOWN-LIMITATIONS.txt"

          APP_VERSION="$(python3 -c 'from energyradar import config; print(config.APP_VERSION)')" \
          APP_BUILD="$(python3 -c 'from energyradar import config; print(config.APP_BUILD)')" \
          ARCHITECTURE="$architecture" ARTIFACT_FILENAME="$filename" STAGING="$staging" \
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          staging = Path(os.environ["STAGING"])
          bundled = json.loads((staging / "EnergyRadar.app/Contents/Resources/BUILDINFO.json").read_text())
          audit = (staging / "ARCHITECTURE-AUDIT.txt").read_text()
          signing = next(line.split("=", 1)[1] for line in audit.splitlines() if line.startswith("signing_state="))
          lines = [
              "format=energyradar-macos-buildinfo-v1",
              f"application_version={os.environ['APP_VERSION']}",
              f"bundle_version={bundled['bundle_version']}",
              f"build_version={os.environ['APP_BUILD']}",
              f"source_commit={bundled['source_commit']}",
              f"workflow_run={os.environ['GITHUB_RUN_ID']}",
              f"artifact={os.environ['ARTIFACT_FILENAME']}",
              f"architecture={os.environ['ARCHITECTURE']}",
              f"signing_state={signing}",
              "notarized=false",
              "stapled=false",
          ]
          (staging / "BUILDINFO.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          (
            cd "$staging"
            shasum -a 256 \
              BUILDINFO.txt \
              MACOS-SMOKE-CHECKLIST.txt \
              ARCHITECTURE-AUDIT.txt \
              KNOWN-LIMITATIONS.txt \
              EnergyRadar.app/Contents/Info.plist \
              EnergyRadar.app/Contents/MacOS/EnergyRadar \
              > SHA256SUMS.txt
          )
          (
            cd "$staging"
            /usr/bin/zip -qry --symlinks "$GITHUB_WORKSPACE/dist/$filename" \
              EnergyRadar.app \
              BUILDINFO.txt \
              MACOS-SMOKE-CHECKLIST.txt \
              ARCHITECTURE-AUDIT.txt \
              KNOWN-LIMITATIONS.txt \
              SHA256SUMS.txt
          )
          unzip -t "dist/$filename"
          zipinfo -1 "dist/$filename" | grep -q '^EnergyRadar\.app/'
          for required in BUILDINFO.txt MACOS-SMOKE-CHECKLIST.txt ARCHITECTURE-AUDIT.txt KNOWN-LIMITATIONS.txt SHA256SUMS.txt; do
            zipinfo -1 "dist/$filename" | grep -qx "$required"
          done
          (
            cd dist
            shasum -a 256 "$filename" > "$filename.sha256"
            shasum -a 256 -c "$filename.sha256"
          )
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Upload native macOS artifact and audit
        uses: actions/upload-artifact@v4
        with:
          name: EnergyRadar-macOS-${{ matrix.architecture }}-${{ steps.artifact.outputs.short_sha }}
          path: |
            dist/${{ steps.artifact.outputs.filename }}
            dist/${{ steps.artifact.outputs.filename }}.sha256
            dist/ARCHITECTURE-AUDIT.txt
          if-no-files-found: error
          retention-days: 30

  package:
    name: Prepare release assets
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: EnergyRadar-windows
          path: package-input/EnergyRadar-Windows-x64

      - name: Resolve commit-specific artifact names
        id: artifact
        shell: bash
        run: echo "short_sha=${ENERGYRADAR_SOURCE_COMMIT:0:7}" >> "$GITHUB_OUTPUT"

      - name: Download macOS Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: EnergyRadar-macOS-arm64-${{ steps.artifact.outputs.short_sha }}
          path: package-input/macos-arm64

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: EnergyRadar-macOS-x86_64-${{ steps.artifact.outputs.short_sha }}
          path: package-input/macos-x86_64

      - name: Package and checksum release files
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${ENERGYRADAR_SOURCE_COMMIT:0:7}"
          arm_zip="EnergyRadar-macOS-arm64-${short_sha}.zip"
          intel_zip="EnergyRadar-macOS-x86_64-${short_sha}.zip"
          test -f "package-input/EnergyRadar-Windows-x64/EnergyRadar.exe"
          test -f "package-input/macos-arm64/$arm_zip"
          test -f "package-input/macos-arm64/$arm_zip.sha256"
          test -f "package-input/macos-x86_64/$intel_zip"
          test -f "package-input/macos-x86_64/$intel_zip.sha256"
          mkdir release-assets
          (
            cd package-input
            zip -q -r "../release-assets/EnergyRadar-Windows-x64.zip" "EnergyRadar-Windows-x64"
            mv "macos-arm64/$arm_zip" "../release-assets/$arm_zip"
            mv "macos-arm64/$arm_zip.sha256" "../release-assets/$arm_zip.sha256"
            mv "macos-x86_64/$intel_zip" "../release-assets/$intel_zip"
            mv "macos-x86_64/$intel_zip.sha256" "../release-assets/$intel_zip.sha256"
            cd ../release-assets
            sha256sum --check --strict "$arm_zip.sha256"
            sha256sum --check --strict "$intel_zip.sha256"
            sha256sum \
              "EnergyRadar-Windows-x64.zip" \
              "$arm_zip" \
              "$intel_zip" \
              > "SHA256SUMS.txt"
          )

      - name: Validate release asset contract
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          short_sha="${ENERGYRADAR_SOURCE_COMMIT:0:7}"
          arm_zip="EnergyRadar-macOS-arm64-${short_sha}.zip"
          intel_zip="EnergyRadar-macOS-x86_64-${short_sha}.zip"
          expected_files="$(printf '%s\n' EnergyRadar-Windows-x64.zip "$arm_zip" "$arm_zip.sha256" "$intel_zip" "$intel_zip.sha256" SHA256SUMS.txt | sort)"
          actual_files="$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          test "$actual_files" = "$expected_files"
          sha256sum --check --strict "$arm_zip.sha256"
          sha256sum --check --strict "$intel_zip.sha256"
          sha256sum --check --strict SHA256SUMS.txt

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: EnergyRadar-release-assets
          path: |
            release-assets/EnergyRadar-Windows-x64.zip
            release-assets/EnergyRadar-macOS-arm64-*.zip
            release-assets/EnergyRadar-macOS-arm64-*.zip.sha256
            release-assets/EnergyRadar-macOS-x86_64-*.zip
            release-assets/EnergyRadar-macOS-x86_64-*.zip.sha256
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
